[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rag-pipeline"
version = "0.1.0"
description = "Adaptive query enhancement and retrieval pipeline for medical expert-system articles"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]